<!DOCTYPE html>
<html>
    <head>
        <title>Personal Course Organizer</title>
        <link rel="stylesheet" href="style.css">
    </head>
<body class=".add-page">
<header>

 <h1>Personal Course Organizer💖</h1>

 <nav>
 <a href="index.html">Home</a>
 <a href="courses.html">My Courses</a>
 <a href="add.html">Add Courses</a>
 <a href="contact.html">Contact Us</a>
 </nav>

</header>
 
<main>
    <form class=".add-page">
        <h1> Add Course </h1>
    <label for="courseName">Course Name:</label>
    <input type="text" id="courseName" required>

    <label for="instructor">instructor:</label>
    <input type="text" id="instructor" required>

    <label for="creditHours">Credit Hours:</label>
    <input type="number" id="creditHours" required>

    <label for="status">status:</label>
    <select id="status">
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>

    <label for="notes">Notes:</label>
    <textarea id="notes" rows="3"></textarea>
    <br> 

    <button type="submit"> Add Course </button>
  </form>
</main>
</body>

</html>
